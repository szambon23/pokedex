<div class="filters">
  <select #typeSelect (change)="search({ type: typeSelect.value || null })">
    <option value="">All types</option>
    @for (t of types.value() ?? []; track t.name) {
      <option [value]="t.name" [selected]="t.name === type()">{{ t.name }}</option>
    }
  </select>

  <input
  #nameInput
  type="search"
  placeholder="Search by name"
  [value]="name() ?? ''"
  (input)="nameInput$.next(nameInput.value)" />

  <select #sortSelect (change)="search({ sort: sortSelect.value })">
    @for (option of sortOptions; track option.value) {
      <option [value]="option.value" [selected]="option.value === (sort() ?? 'pokedexNumber')">
        {{ option.label }}
      </option>
    }
  </select>

    @if (hasActiveFilters()) {
    <button type="button" (click)="clearFilters()">Clear filters</button>
  }
</div>

@if (pokemons.isLoading()) {
  <p>Loading...</p>
} @else if (pokemons.error()) {
  <p>Failed to load Pokémon.</p>
} @else {
  <section class="pokemon-grid">
    @for (pokemon of pokemons.value()?.content ?? []; track pokemon.pokedexNumber) {
      <a [routerLink]="['/pokemon', pokemon.pokedexNumber]">
        <app-pokemon-card [pokemon]="pokemon" [highlightStat]="highlightedStat()" />
      </a>
    } @empty {
      <p>No Pokémon available.</p>
    }
  </section>

  <nav class="pagination">
    <button (click)="goToPage(page() - 1)" [disabled]="page() === 1">← Previous</button>
    <span>Page {{ page() }} of {{ totalPages() }}</span>
    <button (click)="goToPage(page() + 1)" [disabled]="page() >= totalPages()">Next →</button>
  </nav>
}
