<section class="draft">
  <input
    #nameField
    type="text"
    maxlength="50"
    placeholder="Team name"
    [value]="teamName()"
    (input)="teamName.set(nameField.value)"
  />

  <label class="clause">
    <input
      #clauseBox
      type="checkbox"
      [checked]="speciesClause()"
      (change)="speciesClause.set(clauseBox.checked)"
    />
    Species Clause
  </label>

  <ol class="slots">
    @for (slot of slots(); track $index) {
      <li>
        @if (slot) {
          <button
            type="button"
            class="slot-button"
            (click)="removeMember($index)"
            [title]="'Remove ' + slot.name"
          >
            @if (slot.spriteUrl) {
              <img [src]="slot.spriteUrl" [alt]="slot.name" />
            } @else {
              <span class="no-sprite">?</span>
            }
          </button>
        } @else {
          <span class="empty-slot">+</span>
        }
      </li>
    }
  </ol>

  @if (saveError(); as message) {
    <p class="error">{{ message }}</p>
  }
  <button type="button" (click)="save()" [disabled]="!canSave()">Save</button>
</section>

<app-pokemon-list
  [selectable]="true"
  [page]="page()"
  [name]="name()"
  [type]="type()"
  [sort]="sort()"
  (pokemonSelected)="addMember($event)"
/>
